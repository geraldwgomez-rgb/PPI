<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <title>Crear cuenta </title>
</head>
<body>
    <style>
        body {
            background-color: #121212; 
            color: #e0e0e0; 
        }
    </style>
    <div class="container d-flex justify-content-center align-items-center my-5" style="min-height: 90vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            
            <div class="card bg-dark border-info border-opacity-50 shadow-lg p-4" style="border-radius: 20px;">
                <div class="card-body">
                    <h2 class="text-info fw-bold text-center mb-2">Crear Cuenta</h2>
                    <p class="text-secondary text-center small mb-4">Únete a SMC y organiza las finanzas de tu comercio</p>
                    
                    <form>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-white small fw-light">Nombre</label>
                                <input type="text" class="form-control bg-black border-secondary text-white py-2" placeholder="Tu nombre">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-white small fw-light">Apellido</label>
                                <input type="text" class="form-control bg-black border-secondary text-white py-2" placeholder="Tu apellido">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small fw-light">Nombre del Negocio / Comercio</label>
                            <input type="text" class="form-control bg-black border-secondary text-white py-2" placeholder="Ej: Tienda de Ropa Estilo">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small fw-light">Correo Electrónico</label>
                            <input type="email" class="form-control bg-black border-secondary text-white py-2" placeholder="correo@ejemplo.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small fw-light">Contraseña</label>
                            <input type="password" class="form-control bg-black border-secondary text-white py-2" placeholder="Crea una clave segura">
                            <div id="passwordHelp" class="form-text text-muted" style="font-size: 0.75rem;">Mínimo 8 caracteres, incluye letras y números.</div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input bg-black border-secondary" id="terms">
                            <label class="form-check-label text-secondary small" for="terms">
                                Acepto los <a href="#" class="text-info text-decoration-none">términos y condiciones</a>
                            </label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-info fw-bold py-2 shadow-sm text-uppercase" style="letter-spacing: 1px;">
                                Registrarme Ahora
                            </button>
                        </div>

                        <div class="mt-4 text-center">
                            <p class="small text-secondary mb-1">¿Ya tienes una cuenta?</p>
                            <a href="Iniciar_seccion.html" class="text-info text-decoration-none small fw-bold">Inicia sesión aquí</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
    
    
</body>
</html>
